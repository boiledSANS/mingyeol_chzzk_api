<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연동 완료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DungGeunMo&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7fc4f0;
    --sky-bottom:#bfe6ff;
    --grass:#5b9a3c;
    --grass-dark:#3f7a2b;
    --dirt:#7a5230;
    --dirt-dark:#5a3b21;
    --stone:#8a8a86;
    --stone-dark:#5f5f5c;
    --panel:#c6c6c6;
    --panel-dark:#8b8b8b;
    --panel-light:#ffffff;
    --diamond:#5be3d0;
    --diamond-dark:#2fae9c;
    --gold:#ffd23f;
    --ink:#2b2b2b;
    --cream:#f4ecd8;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'DungGeunMo','Press Start 2P',monospace;
    color:var(--ink);
    overflow:hidden;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,#d8f0ff 100%);
    image-rendering:pixelated;
  }

  /* pixel clouds */
  .cloud{
    position:absolute;
    background:#ffffff;
    opacity:.9;
    box-shadow:
      16px 0 0 0 #fff,
      32px 0 0 0 #fff,
      16px -12px 0 0 #fff,
      32px -12px 0 0 #fff;
    width:16px;height:12px;
  }
  .cloud1{ top:8%; left:6%; transform:scale(1.6); animation: drift 60s linear infinite; }
  .cloud2{ top:14%; right:10%; transform:scale(1.1); animation: drift 80s linear infinite reverse; }
  .cloud3{ top:20%; left:40%; transform:scale(1.3); animation: drift 100s linear infinite; }
  @keyframes drift{
    from{ transform-origin:center; margin-left:0; }
    to{ margin-left:-120vw; }
  }

  /* distant blocky terrain */
  .terrain{
    position:absolute;
    left:0; right:0; bottom:0;
    height:22vh;
    background:
      repeating-linear-gradient(90deg, var(--grass) 0 40px, var(--grass-dark) 40px 44px);
    box-shadow: 0 -6px 0 0 rgba(0,0,0,.08) inset;
  }
  .terrain::before{
    content:"";
    position:absolute;
    top:-14px; left:0; right:0; height:14px;
    background:
      repeating-linear-gradient(90deg, var(--grass) 0 40px, var(--grass-dark) 40px 44px);
    clip-path: polygon(0 100%, 0 40%, 10px 40%, 10px 0, 20px 0, 20px 40%, 30px 40%, 30px 0, 44px 0, 44px 40%, 54px 40%, 54px 0, 64px 0, 64px 40%, 74px 40%, 74px 0, 88px 0, 88px 40%, 98px 40%, 98px 0, 108px 0,108px 40%,100% 40%,100% 100%);
  }

  /* main panel styled like a Minecraft GUI */
  .panel{
    position:relative;
    z-index:5;
    width:min(90vw, 480px);
    padding:38px 28px 30px;
    background:var(--panel);
    border:6px solid var(--panel-dark);
    box-shadow:
      inset 3px 3px 0 0 var(--panel-light),
      inset -3px -3px 0 0 var(--panel-dark),
      0 10px 0 0 rgba(0,0,0,.15),
      0 0 0 6px #3a3a38;
    text-align:center;
    animation: pop-in .5s steps(6) both;
  }

  @keyframes pop-in{
    0%{ transform: scale(.7); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }

  .badge{
    width:84px;height:84px;
    margin:-70px auto 18px;
    position:relative;
    background:var(--diamond);
    border:5px solid var(--diamond-dark);
    box-shadow:
      inset 3px 3px 0 0 rgba(255,255,255,.6),
      inset -3px -3px 0 0 rgba(0,0,0,.2),
      0 6px 0 0 rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: badge-bounce .6s .1s steps(8) both;
  }
  @keyframes badge-bounce{
    0%{ transform: translateY(-30px) scale(.5); opacity:0;}
    60%{ transform: translateY(4px) scale(1.05); opacity:1;}
    100%{ transform: translateY(0) scale(1);}
  }
  .badge svg{ width:44px; height:44px; }

  .title{
    font-family:'Press Start 2P',monospace;
    font-size: clamp(15px, 4.2vw, 20px);
    line-height:1.7;
    color:#2f5d1f;
    text-shadow: 2px 2px 0 rgba(255,255,255,.5);
    margin: 6px 0 14px;
    letter-spacing:1px;
  }

  .subtitle{
    font-family:'DungGeunMo','Press Start 2P',monospace;
    font-size: clamp(14px, 3.6vw, 17px);
    color:#4a4a46;
    line-height:1.8;
    margin: 0 0 26px;
  }

  .divider{
    height:4px;
    margin: 0 0 22px;
    background: repeating-linear-gradient(90deg, var(--panel-dark) 0 8px, transparent 8px 16px);
    opacity:.6;
  }

  .close-hint{
    display:inline-block;
    font-family:'Press Start 2P',monospace;
    font-size:11px;
    color:#7a5a1f;
    background:var(--gold);
    border:3px solid #b5811a;
    box-shadow:
      inset 2px 2px 0 0 rgba(255,255,255,.5),
      inset -2px -2px 0 0 rgba(0,0,0,.2);
    padding:8px 14px;
    margin-bottom:8px;
  }

  .footer-links{
    margin-top:28px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }

  .footer-links button{
    font-family:'DungGeunMo','Press Start 2P',monospace;
    font-size:12px;
    color:#3a3a38;
    background:#d9d9d6;
    border:2px solid var(--panel-dark);
    box-shadow:
      inset 1px 1px 0 0 var(--panel-light),
      inset -1px -1px 0 0 var(--panel-dark);
    padding:6px 10px;
    cursor:pointer;
    transition: transform .05s ease;
  }
  .footer-links button:hover{
    background:#e8e8e5;
  }
  .footer-links button:active{
    transform: translateY(2px);
    box-shadow:none;
  }

  .footer-links span{
    color:#8a8a86;
    align-self:center;
    font-size:11px;
  }

  @media (max-width:420px){
    .panel{ padding:34px 18px 24px; }
    .title{ font-size:14px; }
    .subtitle{ font-size:13px; }
  }
</style>
</head>
<body>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <div class="panel">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="4" stroke-linecap="square"/>
      </svg>
    </div>

    <div class="title">연동이<br>완료되었습니다!</div>

    <div class="subtitle">이제 이 페이지를 닫아도 좋습니다.</div>

    <div class="divider"></div>

    <div class="footer-links">
      <button type="button" onclick="location.href='terms.html'">이용약관</button>
      <span>|</span>
      <button type="button" onclick="location.href='privacy.html'">개인정보 처리방침</button>
    </div>
  </div>

  <div class="terrain"></div>

</body>
</html>
