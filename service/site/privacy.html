<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인정보 처리방침</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DungGeunMo&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#7fc4f0;
    --sky-bottom:#bfe6ff;
    --grass:#5b9a3c;
    --grass-dark:#3f7a2b;
    --panel:#c6c6c6;
    --panel-dark:#8b8b8b;
    --panel-light:#ffffff;
    --diamond:#5be3d0;
    --diamond-dark:#2fae9c;
    --gold:#ffd23f;
    --ink:#2b2b2b;
    --paper:#f6f1e2;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'DungGeunMo','Press Start 2P',monospace;
    color:var(--ink);
  }

  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    min-height:100vh;
    padding:40px 16px 60px;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,#d8f0ff 100%);
  }

  .cloud{
    position:fixed;
    background:#ffffff;
    opacity:.85;
    box-shadow:
      16px 0 0 0 #fff,
      32px 0 0 0 #fff,
      16px -12px 0 0 #fff,
      32px -12px 0 0 #fff;
    width:16px;height:12px;
    z-index:0;
  }
  .cloud1{ top:6%; left:10%; transform:scale(1.2); }
  .cloud2{ top:12%; right:8%; transform:scale(1.4); }

  .terrain{
    position:fixed;
    left:0; right:0; bottom:0;
    height:16vh;
    background: repeating-linear-gradient(90deg, var(--grass) 0 40px, var(--grass-dark) 40px 44px);
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:2;
    width:min(92vw, 720px);
  }

  .top-badge{
    width:64px;height:64px;
    margin:0 auto -32px;
    position:relative;
    background:var(--diamond);
    border:5px solid var(--diamond-dark);
    box-shadow:
      inset 3px 3px 0 0 rgba(255,255,255,.6),
      inset -3px -3px 0 0 rgba(0,0,0,.2),
      0 6px 0 0 rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .top-badge svg{ width:30px; height:30px; }

  .panel{
    background:var(--panel);
    border:6px solid var(--panel-dark);
    box-shadow:
      inset 3px 3px 0 0 var(--panel-light),
      inset -3px -3px 0 0 var(--panel-dark),
      0 10px 0 0 rgba(0,0,0,.15),
      0 0 0 6px #3a3a38;
    padding:46px 22px 30px;
  }

  .title{
    font-family:'Press Start 2P',monospace;
    font-size: clamp(14px, 3.8vw, 18px);
    line-height:1.7;
    color:#2f5d1f;
    text-shadow: 2px 2px 0 rgba(255,255,255,.5);
    text-align:center;
    margin: 0 0 6px;
    letter-spacing:1px;
  }

  .updated{
    text-align:center;
    font-size:12px;
    color:#5a5a56;
    margin-bottom:22px;
  }

  .divider{
    height:4px;
    margin: 0 0 22px;
    background: repeating-linear-gradient(90deg, var(--panel-dark) 0 8px, transparent 8px 16px);
    opacity:.6;
  }

  .doc{
    background:var(--paper);
    border:3px solid var(--panel-dark);
    box-shadow:
      inset 2px 2px 0 0 rgba(255,255,255,.5),
      inset -2px -2px 0 0 rgba(0,0,0,.15);
    padding:22px 20px;
    max-height:56vh;
    overflow-y:auto;
    font-family: 'DungGeunMo', monospace;
    font-size:14px;
    line-height:1.9;
    color:#3a352b;
  }

  .doc::-webkit-scrollbar{ width:10px; }
  .doc::-webkit-scrollbar-track{ background:#ded5b8; }
  .doc::-webkit-scrollbar-thumb{ background:var(--panel-dark); border:2px solid #6b6b68; }

  .doc h2{
    font-family:'Press Start 2P',monospace;
    font-size:12px;
    color:#4a7a2f;
    margin: 26px 0 10px;
    line-height:1.6;
  }
  .doc h2:first-child{ margin-top:0; }

  .doc h3{
    font-family:'DungGeunMo',monospace;
    font-size:14px;
    font-weight:bold;
    color:#2b2b2b;
    margin:14px 0 6px;
  }

  .doc p{
    margin: 0 0 12px;
  }

  .doc ul{
    margin:0 0 12px;
    padding-left:20px;
  }
  .doc li{
    margin-bottom:6px;
  }

  table.tbl{
    width:100%;
    border-collapse:collapse;
    margin:0 0 16px;
    font-size:13px;
  }
  table.tbl th, table.tbl td{
    border:2px solid var(--panel-dark);
    padding:8px;
    text-align:left;
    vertical-align:top;
  }
  table.tbl th{
    background:#e4ddc4;
  }

  .note{
    margin-top:18px;
    font-size:12px;
    color:#7a5a1f;
    background:var(--gold);
    border:3px solid #b5811a;
    box-shadow:
      inset 2px 2px 0 0 rgba(255,255,255,.5),
      inset -2px -2px 0 0 rgba(0,0,0,.2);
    padding:10px 12px;
    line-height:1.7;
  }

  .actions{
    margin-top:22px;
    display:flex;
    justify-content:center;
  }

  .btn{
    font-family:'DungGeunMo','Press Start 2P',monospace;
    font-size:13px;
    color:#3a3a38;
    background:#d9d9d6;
    border:2px solid var(--panel-dark);
    box-shadow:
      inset 1px 1px 0 0 var(--panel-light),
      inset -1px -1px 0 0 var(--panel-dark);
    padding:8px 16px;
    cursor:pointer;
  }
  .btn:active{ transform: translateY(2px); box-shadow:none; }

  @media (max-width:480px){
    .panel{ padding:40px 14px 22px; }
    .title{ font-size:13px; }
    .doc{ font-size:13px; max-height:60vh; }
    table.tbl{ font-size:12px; }
  }
</style>
</head>
<body>

  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="wrap">
    <div class="top-badge">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="5" y="10" width="14" height="10" rx="1.5" stroke="#fff" stroke-width="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2"/>
      </svg>
    </div>

    <div class="panel">
      <div class="title">개인정보 처리방침</div>
      <div class="updated">시행일: 2026년 9월 28일</div>
      <div class="divider"></div>

      <div class="doc">
        <!-- 내용을 작성하세요 -->
      </div>

      <div class="actions">
        <button class="btn" type="button" onclick="location.href='/'">닫기</button>
      </div>
    </div>
  </div>

  <div class="terrain"></div>

</body>
</html>
