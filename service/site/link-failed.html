<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연동 실패</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DungGeunMo&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#4a5568;
    --sky-bottom:#6b7280;
    --ground:#4a4038;
    --ground-dark:#2e2620;
    --panel:#c6c6c6;
    --panel-dark:#8b8b8b;
    --panel-light:#ffffff;
    --tnt-red:#e2482f;
    --tnt-red-dark:#a52f1c;
    --gold:#ffd23f;
    --ink:#2b2b2b;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'DungGeunMo','Press Start 2P',monospace;
    color:var(--ink);
    overflow:hidden;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 55%,#7a828f 100%);
  }

  /* smoke puffs instead of clouds */
  .smoke{
    position:absolute;
    background:#9a9a9a;
    opacity:.5;
    box-shadow:
      16px 0 0 0 #9a9a9a,
      32px 0 0 0 #9a9a9a,
      16px -12px 0 0 #9a9a9a,
      32px -12px 0 0 #9a9a9a;
    width:16px;height:12px;
  }
  .smoke1{ top:10%; left:8%; transform:scale(1.5); animation: drift 70s linear infinite; }
  .smoke2{ top:16%; right:10%; transform:scale(1.1); animation: drift 90s linear infinite reverse; }
  @keyframes drift{
    from{ margin-left:0; }
    to{ margin-left:-120vw; }
  }

  /* scorched ground */
  .terrain{
    position:absolute;
    left:0; right:0; bottom:0;
    height:22vh;
    background: repeating-linear-gradient(90deg, var(--ground) 0 40px, var(--ground-dark) 40px 44px);
  }
  .terrain::before{
    content:"";
    position:absolute;
    top:-14px; left:0; right:0; height:14px;
    background: repeating-linear-gradient(90deg, var(--ground) 0 40px, var(--ground-dark) 40px 44px);
    clip-path: polygon(0 100%, 0 40%, 10px 40%, 10px 0, 20px 0, 20px 40%, 30px 40%, 30px 0, 44px 0, 44px 40%, 54px 40%, 54px 0, 64px 0, 64px 40%, 74px 40%, 74px 0, 88px 0, 88px 40%, 98px 40%, 98px 0, 108px 0,108px 40%,100% 40%,100% 100%);
  }

  .panel{
    position:relative;
    z-index:5;
    width:min(90vw, 480px);
    padding:38px 28px 30px;
    background:var(--panel);
    border:6px solid var(--panel-dark);
    box-shadow:
      inset 3px 3px 0 0 var(--panel-light),
      inset -3px -3px 0 0 var(--panel-dark),
      0 10px 0 0 rgba(0,0,0,.15),
      0 0 0 6px #3a3a38;
    text-align:center;
    animation: pop-in .5s steps(6) both;
  }

  @keyframes pop-in{
    0%{ transform: scale(.7); opacity:0; }
    100%{ transform: scale(1); opacity:1; }
  }

  .badge{
    width:84px;height:84px;
    margin:-70px auto 18px;
    position:relative;
    background:var(--tnt-red);
    border:5px solid var(--tnt-red-dark);
    box-shadow:
      inset 3px 3px 0 0 rgba(255,255,255,.35),
      inset -3px -3px 0 0 rgba(0,0,0,.25),
      0 6px 0 0 rgba(0,0,0,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: badge-shake .6s .1s steps(8) both;
  }
  @keyframes badge-shake{
    0%{ transform: translateY(-30px) scale(.5); opacity:0;}
    50%{ transform: translateY(2px) rotate(-6deg) scale(1.05); opacity:1;}
    70%{ transform: rotate(5deg);}
    100%{ transform: translateY(0) rotate(0) scale(1);}
  }
  .badge svg{ width:42px; height:42px; }

  .title{
    font-family:'Press Start 2P',monospace;
    font-size: clamp(15px, 4.2vw, 20px);
    line-height:1.7;
    color:#7a2318;
    text-shadow: 2px 2px 0 rgba(255,255,255,.4);
    margin: 6px 0 14px;
    letter-spacing:1px;
  }

  .subtitle{
    font-family:'DungGeunMo','Press Start 2P',monospace;
    font-size: clamp(14px, 3.6vw, 17px);
    color:#4a4a46;
    line-height:1.8;
    margin: 0 0 6px;
  }

  .reason{
    font-family:'DungGeunMo',monospace;
    font-size:13px;
    color:#6b4a1f;
    background:#f2e6c8;
    border:2px solid var(--panel-dark);
    box-shadow:
      inset 1px 1px 0 0 rgba(255,255,255,.6),
      inset -1px -1px 0 0 rgba(0,0,0,.1);
    padding:10px 12px;
    margin: 16px 0 22px;
    line-height:1.8;
    text-align:left;
  }
  .reason b{ color:#a52f1c; }

  .divider{
    height:4px;
    margin: 0 0 22px;
    background: repeating-linear-gradient(90deg, var(--panel-dark) 0 8px, transparent 8px 16px);
    opacity:.6;
  }

  .actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }

  .btn{
    font-family:'Press Start 2P',monospace;
    font-size:12px;
    padding:12px 16px;
    cursor:pointer;
    border:3px solid;
  }
  .btn-retry{
    color:#4a2600;
    background:var(--gold);
    border-color:#b5811a;
    box-shadow:
      inset 2px 2px 0 0 rgba(255,255,255,.5),
      inset -2px -2px 0 0 rgba(0,0,0,.2);
  }
  .btn-close{
    font-family:'DungGeunMo','Press Start 2P',monospace;
    color:#3a3a38;
    background:#d9d9d6;
    border-color:var(--panel-dark);
    box-shadow:
      inset 1px 1px 0 0 var(--panel-light),
      inset -1px -1px 0 0 var(--panel-dark);
  }
  .btn:active{ transform: translateY(2px); box-shadow:none; }

  .footer-links{
    margin-top:26px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .footer-links button{
    font-family:'DungGeunMo','Press Start 2P',monospace;
    font-size:12px;
    color:#3a3a38;
    background:#d9d9d6;
    border:2px solid var(--panel-dark);
    box-shadow:
      inset 1px 1px 0 0 var(--panel-light),
      inset -1px -1px 0 0 var(--panel-dark);
    padding:6px 10px;
    cursor:pointer;
  }
  .footer-links button:active{ transform: translateY(2px); box-shadow:none; }
  .footer-links span{ color:#8a8a86; align-self:center; font-size:11px; }

  @media (max-width:420px){
    .panel{ padding:34px 18px 24px; }
    .title{ font-size:14px; }
    .subtitle{ font-size:13px; }
  }
</style>
</head>
<body>

  <div class="smoke smoke1"></div>
  <div class="smoke smoke2"></div>

  <div class="panel">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M6 6L18 18M18 6L6 18" stroke="#fff" stroke-width="4" stroke-linecap="square"/>
      </svg>
    </div>

    <div class="title">연동에<br>실패했습니다</div>

    <div class="subtitle">연동 과정에서 문제가 발생했어요.</div>

    <div class="reason">
      <b>오류 코드:</b> {{ERROR_CODE}}<br>
      {{MESSAGE}}
    </div>

    <div class="divider"></div>
  </div>

  <div class="terrain"></div>

</body>
</html>
